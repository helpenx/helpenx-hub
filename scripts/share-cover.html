<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HelpenX Hub · 星阵万象 — 分享封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #04091C; }
  .cover {
    position: relative; width: 1200px; height: 630px;
    background:
      radial-gradient(880px 520px at 16% 46%, rgba(61, 91, 217, .30), transparent 66%),
      radial-gradient(680px 400px at 94% 92%, rgba(245, 197, 66, .13), transparent 70%),
      linear-gradient(135deg, #04091C 0%, #071127 55%, #04091C 100%);
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    color: #EDF1FE; overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(245, 197, 66, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245, 197, 66, .055) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(760px 520px at 30% 45%, #000 20%, transparent 78%);
    mask-image: radial-gradient(760px 520px at 30% 45%, #000 20%, transparent 78%);
  }
  .stars { position: absolute; inset: 0; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #DCE6FF; opacity: .55;
  }
  .badge-wrap {
    position: absolute; left: 64px; top: 50%; width: 440px; height: 440px;
    transform: translateY(-50%);
    filter: drop-shadow(0 26px 70px rgba(245, 197, 66, .16));
  }
  .badge-wrap svg { display: block; width: 100%; height: 100%; }
  .right { position: absolute; left: 556px; top: 92px; right: 76px; }
  .eyebrow { display: flex; align-items: center; gap: 14px; }
  .eyebrow b {
    font-size: 17px; font-weight: 700; letter-spacing: .16em; color: #F5C542;
  }
  .eyebrow span {
    font-size: 15px; letter-spacing: .22em; color: #8FA0CC;
    padding-left: 14px; border-left: 1px solid rgba(245, 197, 66, .35);
  }
  h1 {
    margin-top: 26px; font-size: 58px; line-height: 1.24; font-weight: 700;
    letter-spacing: .015em;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, #FFD86B 0%, #F5C542 52%, #C9932B 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead {
    margin-top: 20px; font-size: 20px; line-height: 1.65; color: #C7D0EE;
  }
  .lead b { color: #FFFFFF; font-weight: 600; }
  .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 9px; max-width: 540px; }
  .chip {
    padding: 6px 13px; border-radius: 999px; font-size: 13.5px; line-height: 1.4;
    color: #FFD86B; border: 1px solid rgba(245, 197, 66, .26);
    background: rgba(245, 197, 66, .055); white-space: nowrap;
  }
  .foot {
    position: absolute; left: 556px; right: 76px; bottom: 48px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15.5px; color: #8FA0CC;
  }
  .foot b { color: #EDF1FE; font-weight: 600; }
  .foot .dot { color: #F5C542; margin: 0 8px; }
</style>
</head>
