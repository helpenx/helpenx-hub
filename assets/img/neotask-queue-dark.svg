<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="nq-t nq-d">
  <title id="nq-t">NeoTask 异步任务队列示意</title>
  <desc id="nq-d">业务代码把任务投递进带优先级的队列，多个 Worker 并列消费；失败任务按退避策略退回队列重试。</desc>
  <defs>
    <linearGradient id="nq-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#45b8d8"/>
      <stop offset="100%" stop-color="#9c8cec"/>
    </linearGradient>
    <linearGradient id="nq-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#45b8d8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#9c8cec" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="nq-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#9fb4cc" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="nq-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="nq-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#45b8d8" fill-opacity="0.75"/>
    </marker>
  </defs>

  <rect width="480" height="300" fill="#0d1a2b"/>
  <rect width="480" height="300" fill="url(#nq-grid)"/>
  <text x="22" y="30" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="1.6" fill="#45b8d8" fill-opacity="0.9">ASYNC TASK QUEUE</text>

  <!-- 生产端 -->
  <g filter="url(#nq-soft)">
    <rect x="20" y="112" width="104" height="88" rx="12" fill="#162236" stroke="#9fb4cc" stroke-opacity="0.14"/>
  </g>
  <text x="72" y="158" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#9fb4cc">业务代码</text>
  <text x="72" y="181" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#93a7bf">enqueue()</text>

  <path d="M128 156h18" stroke="#45b8d8" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" marker-end="url(#nq-arrow)"/>

  <!-- 队列 -->
  <rect x="158" y="64" width="172" height="184" rx="14" fill="url(#nq-fill)" stroke="#45b8d8" stroke-opacity="0.3"/>
  <text x="174" y="92" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600" fill="#45b8d8">队列</text>
  <text x="314" y="92" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#93a7bf">3 待处理</text>

  <g>
    <rect x="174" y="104" width="140" height="34" rx="8" fill="#162236" stroke="#45b8d8" stroke-opacity="0.4"/>
    <rect x="183" y="114" width="26" height="15" rx="4" fill="#45b8d8" fill-opacity="0.14"/>
    <text x="196" y="125" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700" fill="#45b8d8">P0</text>
    <text x="216" y="127" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" fill="#9fb4cc">分镜生成</text>
    <circle cx="301" cy="121" r="4" fill="#46c189"/>
  </g>
  <g>
    <rect x="174" y="146" width="140" height="34" rx="8" fill="#162236" stroke="#9fb4cc" stroke-opacity="0.14"/>
    <rect x="183" y="156" width="26" height="15" rx="4" fill="#d8a94f" fill-opacity="0.16"/>
    <text x="196" y="167" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700" fill="#d8a94f">P1</text>
    <text x="216" y="169" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" fill="#9fb4cc">批量导出</text>
    <circle cx="301" cy="163" r="4" fill="#d8a94f"/>
  </g>
  <g>
    <rect x="174" y="188" width="140" height="34" rx="8" fill="#162236" stroke="#9fb4cc" stroke-opacity="0.1"/>
    <rect x="183" y="198" width="26" height="15" rx="4" fill="#9fb4cc" fill-opacity="0.08"/>
    <text x="196" y="209" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700" fill="#93a7bf">P2</text>
    <text x="216" y="211" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" fill="#a3b5ca">缓存清理</text>
    <circle cx="301" cy="205" r="4" fill="#93a7bf" fill-opacity="0.45"/>
  </g>

  <path d="M334 156h18" stroke="#45b8d8" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" marker-end="url(#nq-arrow)"/>

  <!-- Worker -->
  <g filter="url(#nq-soft)">
    <rect x="360" y="86" width="100" height="46" rx="10" fill="#162236" stroke="#9fb4cc" stroke-opacity="0.14"/>
    <rect x="360" y="144" width="100" height="46" rx="10" fill="#162236" stroke="#9fb4cc" stroke-opacity="0.14"/>
  </g>
  <rect x="360" y="202" width="100" height="46" rx="10" fill="#162236" stroke="#9fb4cc" stroke-opacity="0.1" stroke-dasharray="5 5"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#9fb4cc">
    <text x="376" y="114">worker 1</text>
    <text x="376" y="172">worker 2</text>
  </g>
  <text x="376" y="230" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#93a7bf">worker 3</text>
  <circle cx="436" cy="109" r="4" fill="#46c189"/>
  <circle cx="436" cy="167" r="4" fill="#46c189"/>
  <circle cx="436" cy="225" r="4" fill="#93a7bf" fill-opacity="0.45"/>

  <!-- 失败重试 -->
  <path d="M410 248c0 20-42 20-42 20h-34" fill="none" stroke="#d8a94f" stroke-opacity="0.6" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/>
  <text x="322" y="284" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#d6b06a">失败 · 退避重试</text>

  <!-- 存储 -->
  <line x1="22" y1="272" x2="306" y2="272" stroke="#9fb4cc" stroke-opacity="0.08"/>
  <circle cx="28" cy="288" r="4" fill="#45b8d8"/>
  <text x="40" y="293" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#a3b5ca">内存</text>
  <path d="M76 288h16" stroke="#45b8d8" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#nq-arrow)"/>
  <circle cx="104" cy="288" r="4" fill="#9c8cec"/>
  <text x="116" y="293" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#a3b5ca">Redis</text>
</svg>
