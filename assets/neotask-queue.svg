<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="nq-t nq-d">
  <title id="nq-t">NeoTask 异步任务队列示意</title>
  <desc id="nq-d">业务代码把任务投递进带优先级的队列，多个 Worker 并列消费，可从单机内存平滑切换到 Redis 分布式队列，失败任务按退避策略重试。</desc>
  <defs>
    <linearGradient id="nq-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a7494"/>
      <stop offset="100%" stop-color="#6d4bf0"/>
    </linearGradient>
    <linearGradient id="nq-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a7494" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6d4bf0" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="nq-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#0e1c2e" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="nq-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f2243" flood-opacity="0.10"/>
    </filter>
    <marker id="nq-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0a7494" fill-opacity="0.65"/>
    </marker>
  </defs>

  <rect width="480" height="320" fill="#f6f8fb"/>
  <rect width="480" height="320" fill="url(#nq-grid)"/>

  <text x="24" y="34" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#0a7494" fill-opacity="0.85">ASYNC TASK QUEUE</text>

  <!-- 生产端 -->
  <g filter="url(#nq-soft)">
    <rect x="22" y="118" width="98" height="84" rx="11" fill="#ffffff" stroke="#0e1c2e" stroke-opacity="0.12"/>
  </g>
  <text x="71" y="150" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#0e1c2e">业务代码</text>
  <text x="71" y="170" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#5c6b7f">enqueue()</text>
  <rect x="44" y="181" width="54" height="4" rx="2" fill="url(#nq-link)" fill-opacity="0.5"/>

  <!-- 投递箭头 -->
  <path d="M124 160h22" stroke="#0a7494" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" marker-end="url(#nq-arrow)"/>

  <!-- 队列 -->
  <rect x="152" y="72" width="166" height="176" rx="13" fill="url(#nq-fill)" stroke="#0a7494" stroke-opacity="0.22"/>
  <text x="166" y="96" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600" fill="#0a7494">队列</text>
  <text x="304" y="96" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#5c6b7f">0 / 2 / 0</text>

  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11">
    <g>
      <rect x="166" y="108" width="138" height="30" rx="7" fill="#ffffff" stroke="#0a7494" stroke-opacity="0.35"/>
      <rect x="174" y="117" width="22" height="12" rx="4" fill="#0a7494" fill-opacity="0.12"/>
      <text x="185" y="126" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="8.5" font-weight="700" fill="#0a7494">P0</text>
      <text x="204" y="127" fill="#0e1c2e">生成分镜 · 运行中</text>
      <circle cx="292" cy="123" r="3" fill="#087a43"/>
    </g>
    <g>
      <rect x="166" y="146" width="138" height="30" rx="7" fill="#ffffff" stroke="#0e1c2e" stroke-opacity="0.12"/>
      <rect x="174" y="155" width="22" height="12" rx="4" fill="#96650a" fill-opacity="0.14"/>
      <text x="185" y="164" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="8.5" font-weight="700" fill="#96650a">P1</text>
      <text x="204" y="165" fill="#0e1c2e">批量导出 · 排队</text>
      <circle cx="292" cy="161" r="3" fill="#c9a227" fill-opacity="0.9"/>
    </g>
    <g>
      <rect x="166" y="184" width="138" height="30" rx="7" fill="#ffffff" stroke="#0e1c2e" stroke-opacity="0.09"/>
      <rect x="174" y="193" width="22" height="12" rx="4" fill="#0e1c2e" fill-opacity="0.07"/>
      <text x="185" y="202" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="8.5" font-weight="700" fill="#5c6b7f">P2</text>
      <text x="204" y="203" fill="#4b5d72">清理缓存 · 排队</text>
      <circle cx="292" cy="199" r="3" fill="#5c6b7f" fill-opacity="0.45"/>
    </g>
  </g>
  <rect x="166" y="222" width="138" height="12" rx="6" fill="#0a7494" fill-opacity="0.10"/>
  <rect x="166" y="222" width="86" height="12" rx="6" fill="url(#nq-link)" fill-opacity="0.55"/>

  <!-- 消费箭头 -->
  <path d="M320 160h22" stroke="#0a7494" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" marker-end="url(#nq-arrow)"/>

  <!-- Worker -->
  <g filter="url(#nq-soft)" font-family="ui-monospace, Consolas, monospace" font-size="10.5">
    <rect x="350" y="88" width="108" height="42" rx="9" fill="#ffffff" stroke="#0e1c2e" stroke-opacity="0.12"/>
    <text x="364" y="114" fill="#0e1c2e">worker 1</text>
    <circle cx="442" cy="109" r="3" fill="#087a43"/>

    <rect x="350" y="140" width="108" height="42" rx="9" fill="#ffffff" stroke="#0e1c2e" stroke-opacity="0.12"/>
    <text x="364" y="166" fill="#0e1c2e">worker 2</text>
    <circle cx="442" cy="161" r="3" fill="#087a43"/>

    <rect x="350" y="192" width="108" height="42" rx="9" fill="#ffffff" stroke="#0e1c2e" stroke-opacity="0.09" stroke-dasharray="4 4"/>
    <text x="364" y="218" fill="#5c6b7f">worker 3</text>
    <circle cx="442" cy="213" r="3" fill="#5c6b7f" fill-opacity="0.4"/>
  </g>

  <!-- 失败重试 -->
  <path d="M404 234c0 26-38 26-38 26h-32" fill="none" stroke="#96650a" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text x="318" y="272" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="10" fill="#96650a" fill-opacity="0.9">失败 · 指数退避重试</text>

  <!-- 后端 -->
  <line x1="24" y1="290" x2="456" y2="290" stroke="#0e1c2e" stroke-opacity="0.08"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="10.5">
    <circle cx="30" cy="304" r="3" fill="#0a7494"/>
    <text x="40" y="308" fill="#4b5d72">内存队列 · 零外部依赖</text>
    <path d="M168 304h16" stroke="#0a7494" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round" marker-end="url(#nq-arrow)"/>
    <circle cx="196" cy="304" r="3" fill="#6d4bf0"/>
    <text x="206" y="308" fill="#4b5d72">Redis 分布式 · 平滑扩展</text>
  </g>
</svg>
